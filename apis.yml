aid: google-anthos
name: Google Anthos
description: >-
  Google Anthos is a managed application platform that extends Google Cloud services and engineering practices to hybrid
  and multi-cloud environments. Built on Kubernetes, Anthos enables consistent development and operations across
  on-premises data centers, Google Cloud, and other public clouds like AWS and Azure, with centralized management,
  policy enforcement, and service mesh capabilities.
type: Index
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
