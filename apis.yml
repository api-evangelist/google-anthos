- aid: google-anthos:anthos-multicloud-api
  name: Anthos Multicloud API
  description: >-
    The Anthos Multicloud API provides programmatic access to manage Anthos clusters running on other
    public clouds such as AWS and Azure. Developers can use the API to create, update, and delete attached
    clusters and manage node pools on external cloud providers while maintaining centralized management
    through Google Cloud.
