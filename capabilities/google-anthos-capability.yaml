naftiko: 1.0.0-alpha2
info:
  label: Google Anthos Google GKE On-Prem API
  description: The GKE On-Prem API provides programmatic access to manage the lifecycle of on-premises Kubernetes clusters
    running on VMware or bare metal infrastructure as part of Google Distributed Cloud. It enables creating, updating, deleting,
    and monitoring clusters, managing node pools, and handling enrollment and upgrades.
  tags:
  - Google
  - Anthos
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
